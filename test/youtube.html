<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>検証用 YouTube埋め込み</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 64px;
    line-height: 1.7;
  }
  .video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
  }
  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>
<h1>検証用ページ: YouTube埋め込み</h1>
<p>このページは、フィルタの検証パイプライン（実装C・実装A）が
YouTube埋め込みプレーヤーの再生失敗を検知できるかを確認するためだけに置いている、
サイトに埋め込まれたYouTube動画1本だけの最小限のページです。</p>
<div class="video-wrap">
  <iframe
    src="https://www.youtube.com/embed/0E00Zuayv9Q?autoplay=1&mute=1&playsinline=1"
    title="YouTube埋め込み（検証用）"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen
  ></iframe>
</div>
</body>
</html>
