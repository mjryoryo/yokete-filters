<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ヨケテ - 検証結果</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    max-width: 840px;
    margin: 0 auto;
    padding: 24px 16px 64px;
    line-height: 1.7;
    color: #1c1c1e;
    background: #fafafa;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #f2f2f2; background: #121212; }
    table { background: #1c1c1e; }
    th { background: #2c2c2e; }
    td, th { border-color: #3a3a3c; }
    a { color: #6cb2ff; }
  }
  h1 { font-size: 1.5rem; margin-top: 0; }
  h2 { font-size: 1.1rem; margin-top: 2rem; }
  ul { padding-left: 1.4rem; }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.92rem; }
  th, td { text-align: left; padding: 6px 8px; border: 1px solid #d8d8dc; }
  th { background: #eef0f2; }
  tbody tr:nth-child(even) { background: rgba(0,0,0,0.02); }
  footer { margin-top: 3rem; font-size: 0.82rem; color: #666; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
{{BODY}}
<footer>
  <p>ヨケテ（Safari用コンテンツブロッカー）</p>
</footer>
</body>
</html>
